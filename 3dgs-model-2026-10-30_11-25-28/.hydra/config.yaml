data:
  mesh_split:
    _target_: gs_dataset.split_meshes_by_fraction
    _partial_: true
    val_fraction: 0.1
  view_split:
    _target_: gs_dataset.split_views_by_fraction
    _partial_: true
    val_fraction: 0.2
  features_h5: ???
  item: 0
  num_layers: 6
  num_views: 2
  allow_source_as_target: false
  depth_size: 504
  input: image
  image_size: 504
model:
  backbone:
    _target_: gs_backbone.MoGeMixBackbone
    weights: Ruicheng/moge-vitl
    image_size: ${data.image_size}
    groups: first_rest
    init: gaussian
    num_layers: ${data.num_layers}
  patch_size: 14
  feature_dim: 1024
  layer_embed_dim: null
  input_proj_dim: null
  input_proj_identity_init: false
  rgb_patch: false
  rgb_patch_noise: false
  transformer:
    num_blocks: 0
    num_heads: 24
    mlp_ratio: 4.0
    layer_scale_init: 0.0001
    checkpoint_activations: false
  max_sh_degree: 0
  opacity_scale: 0.001
  opacity_bias: 0.0
  scale_scale: 0.1
  scale_bias: 1.0
  scale_lambda: 0.01
  min_scale_mult: 1.0
  sh_scale: 1.0
  zero_init_last_conv: true
  predict_mean_offset: false
sched:
  _target_: module.TimeWSD
  _partial_: true
  max_seconds: ${max_seconds}
  start_seconds: 0.0
  cycle_seconds: 75
  warmup_fraction: 0.05
  decay_fraction: 0.2
  min_lr: 1.0e-06
  trough_event: trough
max_seconds: 150
output_dirname: 3dgs-model-${now:%Y-%m-%d_%H-%M-%S}
output_dir: /app/bla/diff_smoke
seed: 42
torch_detect_anomaly: false
ckpt_path: null
reset_scheduler: false
loss:
  photom:
    for:
    - target
    l1_weight: 1.0
    dssim_weight: 0.85
  background: null
  scale_reg_weight: 0.001
  scale_reg_thresh: 0.05
  mean_offset_reg_weight: 0.01
events:
  periodic:
    every_n_seconds: 50
callbacks:
  lr_monitor:
    _target_: lightning.pytorch.callbacks.LearningRateMonitor
  checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${output_dir}
    filename: model-{epoch}-{step}
    every_n_epochs: ${eval:'${trainer.max_epochs} // 10'}
    save_last: true
    save_on_exception: true
    save_weights_only: false
  event_checkpoint:
    _target_: module.EventCheckpoint
    trigger_event: null
    filename: checkpoint-{count}-step{step}.ckpt
  validation_small:
    _target_: module.EventValidation
    name: small
    trigger_event: periodic
    volumes: 2
    at_end: false
  validation_big:
    _target_: module.EventValidation
    name: big
    trigger_event: null
    volumes: 2
    at_end: true
  validation_small_ema:
    _target_: module.EventValidation
    name: small_ema
    trigger_event: periodic
    volumes: 2
    at_end: false
    ema: true
  validation_big_ema:
    _target_: module.EventValidation
    name: big_ema
    trigger_event: null
    volumes: 2
    at_end: true
    ema: true
  validation_stats:
    _target_: module.ValidationStats
  orbit:
    _target_: module.OrbitCallback
    trigger_event: null
    num_frames: 24
    fps: 12
    crf: 28
    elevation_deg: 20.0
    grid:
    - 1
    - 1
    resolution: 1024
    source_view: true
    path_format: ${output_dir}/orbits/{stage}_orbit_{mode}{n:06d}.mp4
  panel:
    _target_: module.PanelCallback
    trigger_event: null
  scale_layers:
    _target_: module.ScaleLayersCallback
    trigger_event: null
loader:
  batch_size: 1
  num_workers: 2
  persistent_workers: true
trainer:
  max_epochs: 20000
  accelerator: auto
  devices: 1
  check_val_every_n_epoch: null
  log_every_n_steps: 1
  default_root_dir: ${output_dir}
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  precision: bf16-mixed
  val_check_interval: 1000000000
diffusion:
  enabled: true
  grids_dir: /app/bla/grids_test/fit/grids
  dim: null
  num_blocks: 1
  img_token_scale: 0.3
  checkpoint_activations: true
  steps: 20
  eval_seed: 0
  schedule:
    standard:
      mu: 0.0
      sigma: 1.0
    plateau:
      mu: 0.0
      sigma: 1.0
      mirror: false
  ema:
    decay: 0.9995
  spike_skip:
    factor: 4.0
    decay: 0.99
    warmup_steps: 200
optim:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.0001
optim_groups:
  backbone:
    lr: 0.001
wandb:
  project: gsviawt
  mode: offline
  tags: []
  name: diff-smoke
  id: null
  resume: null
