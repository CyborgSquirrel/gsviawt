hydra:
  run:
    dir: ${output_dirname}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - wandb.mode=offline
    - wandb.name=diff-smoke
    - output_dir=/app/bla/diff_smoke
    - diffusion.enabled=true
    - diffusion.grids_dir=/app/bla/grids_test/fit/grids
    - diffusion.num_blocks=1
    - data.input=image
    - data.num_views=2
    - data.depth_size=504
    - data.view_split.val_fraction=0.2
    - model/backbone=moge_mix
    - model.backbone.groups=first_rest
    - model.backbone.init=gaussian
    - optim_groups.backbone.lr=1e-3
    - model.feature_dim=1024
    - max_seconds=150
    - sched=time_wsd
    - sched.cycle_seconds=75
    - sched.decay_fraction=0.2
    - sched.trough_event=trough
    - +events.periodic={every_n_seconds:50}
    - callbacks.validation_small.trigger_event=periodic
    - callbacks.validation_small.volumes=2
    - callbacks.validation_small_ema.trigger_event=periodic
    - callbacks.validation_small_ema.volumes=2
    - callbacks.validation_big.volumes=2
    - callbacks.validation_big_ema.volumes=2
    - callbacks.orbit.trigger_event=null
    - callbacks.panel.trigger_event=null
    - callbacks.scale_layers.trigger_event=null
    - loader.batch_size=1
    - loader.num_workers=2
    - +trainer.precision=bf16-mixed
    - trainer.check_val_every_n_epoch=null
    - +trainer.val_check_interval=1000000000
    - model.zero_init_last_conv=true
  job:
    name: train_gs
    chdir: false
    override_dirname: +events.periodic={every_n_seconds:50},+trainer.precision=bf16-mixed,+trainer.val_check_interval=1000000000,callbacks.orbit.trigger_event=null,callbacks.panel.trigger_event=null,callbacks.scale_layers.trigger_event=null,callbacks.validation_big.volumes=2,callbacks.validation_big_ema.volumes=2,callbacks.validation_small.trigger_event=periodic,callbacks.validation_small.volumes=2,callbacks.validation_small_ema.trigger_event=periodic,callbacks.validation_small_ema.volumes=2,data.depth_size=504,data.input=image,data.num_views=2,data.view_split.val_fraction=0.2,diffusion.enabled=true,diffusion.grids_dir=/app/bla/grids_test/fit/grids,diffusion.num_blocks=1,loader.batch_size=1,loader.num_workers=2,max_seconds=150,model.backbone.groups=first_rest,model.backbone.init=gaussian,model.feature_dim=1024,model.zero_init_last_conv=true,model/backbone=moge_mix,optim_groups.backbone.lr=1e-3,output_dir=/app/bla/diff_smoke,sched.cycle_seconds=75,sched.decay_fraction=0.2,sched.trough_event=trough,sched=time_wsd,trainer.check_val_every_n_epoch=null,wandb.mode=offline,wandb.name=diff-smoke
    id: ???
    num: ???
    config_name: train_gs
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.7
    version_base: '1.3'
    cwd: /app/.claude/worktrees/grid-diffusion
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /app/.claude/worktrees/grid-diffusion/conf
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /app/.claude/worktrees/grid-diffusion/3dgs-model-2026-10-30_11-25-28
    choices:
      sched: time_wsd
      model/backbone: moge_mix
      data/view_split: fraction
      data/mesh_split: fraction
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
