# One-node local Slurm for the 3080 workstation (SL12): partitions low (the dataset builder, preemptible) and high (everything
# else that uses the GPU). A high job that needs the GPU preempts the builder: SIGTERM, GraceTime seconds, SIGKILL, then the
# builder job is requeued and restarts on its own when the GPU is free again. Install: scripts/slurm/README.md.
# Slurm 23.11 (Ubuntu 24.04 slurm-wlm). Check the NodeName line against `slurmd -C` on this machine.
ClusterName=gsviawt
SlurmctldHost=SL12
SlurmUser=slurm
AuthType=auth/munge
CredType=cred/munge

StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log

# process tracking without cgroups: our GPU work runs in a Docker container (outside any job cgroup anyway; scripts/gpu-run
# kills it), so cgroup confinement would buy nothing here
ProctrackType=proctrack/linuxproc
TaskPlugin=task/affinity
MpiDefault=none
ReturnToService=2

SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core
GresTypes=gpu

# preemption by partition priority: jobs of a higher PriorityTier partition preempt those of a lower one; the preempted job is
# requeued (JobRequeue=1: batch jobs are requeueable by default; build_dataset.sbatch also says --requeue)
PreemptType=preempt/partition_prio
PreemptMode=REQUEUE
JobRequeue=1

NodeName=SL12 CPUs=16 RealMemory=60000 Gres=gpu:1 State=UNKNOWN
# GraceTime: seconds between SIGTERM and SIGKILL of a preempted job (gpu-run stops the container processes within ~8 s)
PartitionName=low  Nodes=SL12 Default=YES PriorityTier=1 PreemptMode=REQUEUE GraceTime=15 MaxTime=INFINITE State=UP
PartitionName=high Nodes=SL12 Default=NO  PriorityTier=2 PreemptMode=OFF MaxTime=INFINITE State=UP
