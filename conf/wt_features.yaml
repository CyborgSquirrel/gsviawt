# Config for wt_features.py -- one feature extraction pass per view (see the
# module docstring), with the feature extractor picked by the `extractor` group:
#     extractor=wt     World Tracing decoder tokens on a noised GT point cloud
#     extractor=moge   MoGe-2 DINOv2 intermediate tokens of the RGB image
# Each is a Hydra `_target_` class from extractors.py; see conf/extractor/*.yaml.
defaults:
  - extractor: wt
  - _self_

# --- input: a render_objaverse.py h5 (images, depth_peel, *_intrinsics) ---
input: ???                # required -- pass input=/app/bla/....h5

# Explicit view indices into the h5 (`images` / `depth_peel` row numbers).
views: ???                # required -- pass 'views=[0,5,12]'

# null -> "<input>.<extractor name>_features.h5" next to the input
output: null

# --- output h5 ---
# gzip level for `features`; 0 = no compression filter at all. One chunk == one row's whole
# [L, P, D] volume. Float token volumes barely compress (~7%), so large runs should use 0.
compression_level: 4
# Cast the tokens to this torch dtype before writing (float32 | float16 | bfloat16), null = as
# the extractor returned them. bfloat16 is stored as its raw uint16 bits (see `stored_as_uint16_bits`).
feature_dtype: null

hydra:
  job:
    chdir: false          # stay in cwd; paths are absolute / input-relative
  output_subdir: null     # no .hydra/ dir
  run:
    dir: .                # no outputs/ dir
