# Config for fit_gsplat.py -- optimize a 3D Gaussian Splatting model from one
# render HDF5 (render_objaverse.py / capture_turntable.py schema), seeded from
# the PRIMARY view's 6-layer depth peel and supervised by every view in the
# train split. See fit_gsplat.py's module docstring, and load_catalog_views'
# docstring for what "primary" means now (no longer its own config field).

defaults:
  # Reuses train_gs.py's own conf/data/split_fn/*.yaml option files verbatim
  # (lands at data.split_fn here too, even though nothing else in this
  # config lives under data: -- keeps the override syntax identical to
  # train_gs.py's, e.g. data/split_fn=by_indices
  # data.split_fn.train_idx='[0,1,2]' data.split_fn.val_idx='[3,4]' (the
  # first entry of train_idx is the seeding "primary" view -- see
  # load_catalog_views). by_view (not train_gs.yaml's by_mesh default):
  # fit_gsplat.py fits ONE scene at a time, so a corpus is typically
  # single-mesh already, where by_mesh degenerates to "everything train,
  # nothing val" (see its own docstring) -- by_view actually does
  # something useful here.
  - data/split_fn: by_view
  - _self_

# --- input ---
hdf5_path: /app/bla/objaverse_renders.h5   # str, list, or glob(s)

# null -> "<hdf5_path>.gsplat.view<primary>.h5" (+ .ply)
output_path: null

# --- optimization ---
iters: 10000                # trainer.max_epochs -- one Lightning "epoch" is a
                             # full pass over the train split's views now (see
                             # GSFitDataModule), not a single optimizer step.
seed: 42

# Views per training step, rendered+compared together in one batch (a plain
# DataLoader(shuffle=True, batch_size=...) over the train split -- see
# GSFitDataModule). 1 matches the vanilla 3DGS paper's one-random-camera-
# per-step training loop; set it to the number of train views for full-batch
# gradient descent instead (this repo's original/default behaviour).
loader:
  batch_size: 1
  num_workers: 0

# Whether the optimizer may move Gaussian centers. false = centers stay locked
# at their depth-peel back-projected seed positions; only scale / rotation /
# opacity / colour are optimized (and lr.means is unused).
optimize_means: false

# --- losses ---
lambda_ssim: 0.2          # weight of the (1 - SSIM) term in the RGB loss
lambda_mask: 1.0          # weight of the L1 rendered-alpha vs image-alpha term

# --- Adam learning rates (means additionally scaled by scene_scale) ---
lr:
  means: 1.6e-4
  scales: 5.0e-3
  quats: 1.0e-3
  opacities: 5.0e-2
  colors: 2.5e-3

# --- initialization ---
init_opacity: 0.1         # starting opacity for every seeded Gaussian
knn_k: 4                  # neighbours used to size each Gaussian's initial scale

# --- validation / output ---
write_ply: true           # also write a standard 3DGS .ply next to the .h5
# .ply pruning -- all off by default (the .h5 always keeps every Gaussian).
# Set a value to enable that check.
ply_opacity_threshold: null   # drop splats with sigmoid(opacity) <= this (e.g. 0.0039 ~= 1/255)
ply_max_scale_ratio: null     # drop splats whose largest scale axis > this * scene_scale (e.g. 0.1)
ply_max_anisotropy: null      # drop splats whose scale max/min ratio exceeds this (e.g. 50)

# --- dataset-name overrides (for non-standard files) ---
datasets:
  images: images
  depth: depth_peel
  intrinsics: depth_intrinsics          # matches depth_peel (seed + output-grid resolution)
  image_intrinsics: image_intrinsics    # matches images (photometric-loss resolution)
  pose: camera_pose

wandb:
  project: gsviawt
  mode: disabled              # online | offline | disabled
  tags: [3dgs-optim]
  name: null

# Same wandb train/panel [GT | render | |diff|] comparison train_gs.py logs,
# and (orbit) the same turntable preview video train_gs.py logs -- both
# module.{Panel,Orbit}Callback, shared -- see their own docstrings; each
# pulls straight from GSFitLightningModule.get_preview_source(), no other
# callback needed. To disable either one (e.g. no wandb.mode -> both no-op
# already, but to drop one specifically), remove it on the CLI:
# ~callbacks.orbit.
callbacks:
  panel:
    _target_: module.PanelCallback
    every_n_epochs: ${eval:'${iters} // 50'}

  orbit:
    _target_: module.OrbitCallback
    every_n_epochs: ${eval:'${iters} // 50'}
    num_frames: 24
    fps: 12
    crf: 28
    elevation_deg: 20.0        # camera distance = the primary view's own actual capture
                                # distance (scene_scale), not a re-fit bounding-sphere
                                # framing -- see GSFitLightningModule.get_preview_source

# pl.Trainer kwargs -- everything except `logger` (built in code from the
# wandb run, or False when wandb is disabled). No has_val bookkeeping needed:
# when split_fn produces an empty val split, GSFitDataModule.val_dataloader
# hands Lightning a gs_dataset._EmptyDataset and it skips validation on its
# own, same as train_gs.py.
trainer:
  max_epochs: ${iters}
  accelerator: auto
  devices: 1
  enable_checkpointing: false
  num_sanity_val_steps: 2
  check_val_every_n_epoch: 1
  log_every_n_steps: 10      # matches the original loop's wandb logging cadence (it % 10 == 0)
  # Unset/null by default -- this optimization's lr/loss weights above were
  # tuned without gradient clipping; set this to experiment with it rather
  # than changing the default.
  gradient_clip_val: null
  gradient_clip_algorithm: norm

hydra:
  job:
    chdir: false          # stay in cwd; output paths are absolute / input-relative
  run:
    dir: outputs/fit_gsplat/${now:%Y-%m-%d_%H-%M-%S}   # hydra's .log + .hydra/ land here (gitignored)
