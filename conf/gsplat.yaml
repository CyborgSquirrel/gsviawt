# Config for fit_gsplat.py -- optimize a 3D Gaussian Splatting model from one
# render HDF5 (render_objaverse.py / capture_turntable.py schema), seeded from
# the PRIMARY view's 6-layer depth peel and supervised by every view in the
# train split. See fit_gsplat.py's module docstring, and GSFitSceneDataset's
# docstring for what "primary" means now (no longer its own config field).

defaults:
  # Reuses train_gs.py's own conf/data/split_fn/*.yaml option files verbatim
  # (lands at data.split_fn here too, even though nothing else in this
  # config lives under data: -- keeps the override syntax identical to
  # train_gs.py's, e.g. data/split_fn=by_indices
  # data.split_fn.train_idx='[0,1,2]' data.split_fn.val_idx='[3,4]' (the
  # first entry of train_idx is the seeding "primary" view -- see
  # GSFitSceneDataset). by_view (not train_gs.yaml's by_mesh default):
  # fit_gsplat.py fits ONE scene at a time, so a corpus is typically
  # single-mesh already, where by_mesh degenerates to "everything train,
  # nothing val" (see its own docstring) -- by_view actually does
  # something useful here.
  - data/split_fn: by_view
  - _self_

# --- input ---
hdf5_path: /app/bla/objaverse_renders.h5   # str, list, or glob(s)

# null -> "<hdf5_path>.gsplat.view<primary>.h5" (+ .ply, + .val/ alongside)
output_path: null

# --- optimization ---
iters: 10000                # trainer.max_epochs -- one Lightning "epoch" == one
                             # optimizer step here (see GSFitDataModule)
seed: 42

# Number of views (sampled uniformly at random, without replacement, from the
# full primary+secondary set) to render and supervise on each iteration.
# null (the special "all views" value) renders every view every iteration --
# full-batch gradient descent, this repo's original/default behaviour. Set an
# int (e.g. 1) to instead do stochastic per-iteration view sampling, matching
# the vanilla 3DGS paper's one-random-camera-per-step training loop -- each
# iteration gets cheaper (~views_per_iter/num_views the cost) but noisier, so
# more iterations are typically needed to reach the same quality. Values >=
# the number of views behave identically to null.
views_per_iter: null

# Whether the optimizer may move Gaussian centers. false = centers stay locked
# at their depth-peel back-projected seed positions; only scale / rotation /
# opacity / colour are optimized (and lr.means is unused).
optimize_means: false

# --- losses ---
lambda_ssim: 0.2          # weight of the (1 - SSIM) term in the RGB loss
lambda_mask: 1.0          # weight of the L1 rendered-alpha vs image-alpha term

# --- Adam learning rates (means additionally scaled by scene_scale) ---
lr:
  means: 1.6e-4
  scales: 5.0e-3
  quats: 1.0e-3
  opacities: 5.0e-2
  colors: 2.5e-3

# --- initialization ---
init_opacity: 0.1         # starting opacity for every seeded Gaussian
knn_k: 4                  # neighbours used to size each Gaussian's initial scale

# --- validation / output ---
# Cadence (in iters) for BOTH: the gt|render PNG panel dump below (always
# against the train split, regardless of whether split_fn produced a val
# split) AND, when it did, the held-out val/loss* metrics (Lightning's
# check_val_every_n_epoch). 0 disables the panel dump; the val/loss* metrics
# just don't log if the val split is empty, independent of this.
val_every: 500
write_ply: true           # also write a standard 3DGS .ply next to the .h5
# .ply pruning -- all off by default (the .h5 always keeps every Gaussian).
# Set a value to enable that check.
ply_opacity_threshold: null   # drop splats with sigmoid(opacity) <= this (e.g. 0.0039 ~= 1/255)
ply_max_scale_ratio: null     # drop splats whose largest scale axis > this * scene_scale (e.g. 0.1)
ply_max_anisotropy: null      # drop splats whose scale max/min ratio exceeds this (e.g. 50)

# --- dataset-name overrides (for non-standard files) ---
datasets:
  images: images
  depth: depth_peel
  intrinsics: depth_intrinsics          # matches depth_peel (seed + output-grid resolution)
  image_intrinsics: image_intrinsics    # matches images (photometric-loss resolution)
  pose: camera_pose

wandb:
  project: gsviawt
  mode: disabled              # online | offline | disabled
  tags: [fit-gsplat]
  name: null

# Turntable orbit preview, logged as wandb.Video (needs wandb.mode != disabled).
# Anchored to the primary view's own actual capture distance (scene_scale),
# NOT an auto-fit/bounding-sphere distance -- this optimization has no floor
# forcing Gaussian scale to stay above ~1 pixel of spacing, so a
# tighter-than-capture orbit can expose a false "gaps" artifact. See
# fit_gsplat.py's render_orbit_frames docstring.
orbit:
  enabled: true
  every: 500                 # iterations between orbit renders (0 effectively via enabled=false)
  num_frames: 24
  fps: 12
  crf: 28
  elevation_deg: 20.0

# preview_source must come before panel -- Lightning calls callbacks in
# this list's order, and panel reads what preview_source just stashed.
# Same wandb train/panel [GT | render | |diff|] comparison train_gs.py logs
# (module.PanelCallback, shared -- see its own docstring), now available
# for fit_gsplat.py too. Separate from the val_every gt|render PNG dump
# above -- that compares against the FULL supervision set and writes to
# disk regardless of wandb; this is wandb-only and reuses the same cadence.
callbacks:
  preview_source:
    _target_: __main__.PreviewSourceCallback

  panel:
    _target_: module.PanelCallback
    every_n_epochs: ${val_every}

# pl.Trainer kwargs -- everything except `logger` (built in code from the
# wandb run, or False when wandb is disabled). `has_val` isn't a field you
# set: main() injects it (== whether split_fn produced a non-empty val
# split for this mesh) before the trainer is built, same trick
# train_gs.yaml's sched.total_steps uses.
trainer:
  max_epochs: ${iters}
  accelerator: auto
  devices: 1
  enable_checkpointing: false
  num_sanity_val_steps: ${eval:'2 if ${has_val} else 0'}
  check_val_every_n_epoch: ${eval:'max(1, ${val_every})'}
  limit_val_batches: ${eval:'1.0 if ${has_val} else 0.0'}
  log_every_n_steps: 10      # matches the original loop's wandb logging cadence (it % 10 == 0)
  # Unset/null by default -- this optimization's lr/loss weights above were
  # tuned without gradient clipping; set this to experiment with it rather
  # than changing the default.
  gradient_clip_val: null
  gradient_clip_algorithm: norm

hydra:
  job:
    chdir: false          # stay in cwd; output paths are absolute / input-relative
  run:
    dir: outputs/fit_gsplat/${now:%Y-%m-%d_%H-%M-%S}   # hydra's .log + .hydra/ land here (gitignored)
