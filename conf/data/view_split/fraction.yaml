# View split by proportion, applied to the TRAIN meshes only: inside every
# mesh, holds out round(val_fraction * n_views) (at least 1) views as
# val_views; the rest are train_views. The pick for a mesh depends on its path
# and `seed` only -- see gs_dataset.split_views_by_fraction. val_fraction: 0
# disables it: no val_views_strain / val_views_sval sets.
_target_: gs_dataset.split_views_by_fraction
_partial_: true
val_fraction: 0.0
