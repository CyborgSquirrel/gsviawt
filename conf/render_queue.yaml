# Config for render_queue.py -- renders a mesh list with a pool of queue-mode render_objaverse.py
# workers and merges their part files. See the module docstring.

meshes: ???               # text file, one mesh path per line (required)
output_path: ???          # the merged render h5 (required)
work_dir: ???             # queue.db, parts/ (one h5 per worker process), logs/ (required)

num_workers: 3            # Blender processes running at once
max_meshes_per_worker: 25 # a worker exits after claiming this many meshes (null = no limit); the launcher starts a fresh one
max_attempts: 3           # a job claimed this often without finishing (its workers died) is failed for good
max_rounds: 3             # drain + check passes; meshes missing from every good part are enqueued again between them
claim_timeout: 1800       # seconds a worker may hold one job before it is killed (null = never)

blender: /opt/blender/blender
# Environment for the Blender processes (EEVEE needs the NVIDIA EGL vendor file).
env:
  __EGL_VENDOR_LIBRARY_FILENAMES: /tmp/10_nvidia.json
# Overrides passed to render_objaverse.py as one whitespace-separated string (view strategy,
# resolution, engine, device, ...). The queue_* and output_path keys are set per worker and must not
# be listed here.
render_args: ""

hydra:
  run:
    dir: ${work_dir}/hydra
  job:
    chdir: false
