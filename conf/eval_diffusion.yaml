# eval_diffusion.py: render-space evaluation of diffusion-mode train_gs.py checkpoints on fixed validation volumes.
run_config: ???          # the run's resolved config: <hydra run dir>/.hydra/config.yaml
checkpoints: ???         # list of .ckpt paths of that run; "init" = the freshly initialized model (pipeline test only)
weights: [raw, ema]      # raw: the trained weights; ema: diffusion.ema's average (from the checkpoint's "ema" entry)
samples: 4               # K sampler runs per volume (seeds eval_seed + k), rendered: single (k = 0), mean of K renders, best of K
steps: null              # sampler steps; null: the run's diffusion.steps; a list, e.g. [1,2,3,5,10,20,50]: one <out>/steps<N>/ each,
                         # the volumes / fit / onestep done once
project_format: false    # put every sampler step's x0 prediction into the training grids' format (the run's scale_sort / floor) before it is fed back
project_quat: unit       # with project_format: unit (the rotation made a unit quaternion, w >= 0) | keep (left as predicted, except
                         # where the sort reorders the axes)
val_sets: null           # list of validation set names; null: all of the run's. val_train (the training volumes, train_gs.yaml's
                         # data.val_train) can be named for a run trained without it too
max_volumes: null        # per set: a reproducible random subset of that many volumes (same for every run with the same split);
                         # null: all (say so when reporting a subset)
guidance: null           # classifier-free guidance of the samples (fit is not sampled; onestep and the samples are): null = the
                         # run's diffusion.cfg (default off); or keys of it, on the command line e.g. +guidance.scale=0 (the
                         # unconditional branch) or 'guidance={scale:2,interval:[0.5,1.0],fields:[sh_dc]}' (not guidance.scale=0:
                         # the node is null). Warns on a run trained with cond_dropout.p = 0
seed: 0                  # the target views of a volume and the noise are functions of (seed, set, volume)
grids_dir: null          # overrides for running somewhere else than the run did (null: the run's)
source_h5: null
out: ???                 # output directory: volumes.csv (one row per volume x method) and summary.json
hydra:
  output_subdir: null
  run:
    dir: .
defaults:
  - _self_
  - override hydra/job_logging: none
  - override hydra/hydra_logging: disabled
