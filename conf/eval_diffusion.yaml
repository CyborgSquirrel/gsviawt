# eval_diffusion.py: render-space evaluation of diffusion-mode train_gs.py checkpoints on fixed validation volumes.
run_config: ???          # the run's resolved config: <hydra run dir>/.hydra/config.yaml
checkpoints: ???         # list of .ckpt paths of that run; "init" = the freshly initialized model (pipeline test only)
weights: [raw, ema]      # raw: the trained weights; ema: diffusion.ema's average (from the checkpoint's "ema" entry)
samples: 4               # K sampler runs per volume (seeds eval_seed + k), rendered: single (k = 0), mean of K renders, best of K
steps: null              # sampler steps; null: the run's diffusion.steps; a list, e.g. [1,2,3,5,10,20,50]: one <out>/steps<N>/ each,
                         # the volumes / fit / onestep done once
project_format: false    # put every sampler step's x0 prediction into the training grids' format (the run's scale_sort / floor) before it is fed back
project_quat: unit       # with project_format: unit (the rotation made a unit quaternion, w >= 0) | keep (left as predicted, except
                         # where the sort reorders the axes)
val_sets: null           # list of validation set names; null: all of the run's. val_train (the training volumes, train_gs.yaml's
                         # data.val_train) can be named for a run trained without it too
max_volumes: null        # per set: a reproducible random subset of that many volumes (same for every run with the same split);
                         # null: all (say so when reporting a subset)
guidance: null           # classifier-free guidance of the samples (fit is not sampled; onestep and the samples are): null = the
                         # run's diffusion.cfg (default off); or keys of it, on the command line e.g. +guidance.scale=0 (the
                         # unconditional branch) or 'guidance={scale:2,interval:[0.5,1.0],fields:[sh_dc]}' (not guidance.scale=0:
                         # the node is null). Warns on a run trained with cond_dropout.p = 0
inject_fields: null       # oracle test: a list of x0 fields (opacity, scale, rotation, sh_dc, offset) whose ground truth replaces the
                          # sampler state's channels before every model call, noised to that step's t along the sampler's own noise;
                          # adds the method sample_gt (the sample with those fields' final values set to the ground truth)
inject_source: gt         # with inject_fields: gt (the ground truth; adds sample_gt) | onestep (the model's own one-step prediction
                          # of those fields, i.e. its t = 1 output from the same noise)
sampler_t_min: 0.0         # the samples' Euler step divides by max(t, sampler_t_min); 0 (default since Nov 18 2026): divide by t, exact.
                          # 0.05: WT's clamp, the default of every eval before then (with > 20 steps the steps below 0.05 only partly
                          # denoise, which hides the many-step instability; <= 20 steps identical)
lock_layers: null         # oracle: a list of depth layers (e.g. [0]) held at the ground truth (given at t = 0) while the others are
                          # denoised; adds the method plain_swap (the plain sample with those layers swapped to the ground truth)
layer_stages: null        # staged sampling: groups of depth layers denoised one after the other with `steps` steps each, e.g.
                          # [[0],[1,2,3,4,5]] (the surface first, then the rest; earlier groups held finished at t = 0, later ones at
                          # noise t = 1). The methods stay the same (sample = the staged sample); total model calls = steps x groups
colour_schedule: null     # diffusion.colour_noise separate runs only: the sampler's colour schedule, e.g. 'colour_schedule={kind:first,f:0.25}'
                          # (colour 1 -> 0 linearly over the first fraction f of the steps; f: 1/N = finished after step 1, the
                          # one-step anchor) | '{kind:power,gamma:2}' (t_c = t_g ** gamma); null: power gamma 1 (t_c = t_g)
colour_schedules: null    # a sweep instead: {name: schedule, ...}, each written to <out>/cs_<name>/[steps<N>/] (one process, the
                          # volumes / fit / onestep done once); not together with colour_schedule
seed: 0                  # the target views of a volume and the noise are functions of (seed, set, volume)
grids_dir: null          # overrides for running somewhere else than the run did (null: the run's)
source_h5: null
out: ???                 # output directory: volumes.csv (one row per volume x method) and summary.json
hydra:
  output_subdir: null
  run:
    dir: .
defaults:
  - _self_
  - override hydra/job_logging: none
  - override hydra/hydra_logging: disabled
