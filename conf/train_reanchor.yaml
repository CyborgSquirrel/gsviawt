# train_reanchor.py: the re-anchoring task on ONE mesh (see reanchor.py's docstring for the model, frames and tokens).
#   mode train      the network (model.use_a false: the B-only control; data.identity true: A = B, the identity check)
#   mode direct     sanity check: no network, B's 14 params per slot optimized directly with the training loss, from the matched copy
#   mode roundtrip  sanity check: B's fit through the encode -> normalize -> decode -> B-frame render path vs the fit rendered as is,
#                   and A moved into B's frame vs A rendered in its own; then exits
mode: train

data:
  render_h5: /app/bla/new100/trellis_new100_50views_eevee_504.h5
  grids_dir: /app/bla/reanchor/grids79          # <grids_dir>/mesh<M>_view<V>.h5 (dense or sparse)
  mesh: 79
  train_views: 45            # views 0 .. train_views-1: the grids (A and B) and the training render targets
  eval_views: [45, 46, 47, 48, 49]   # held out: never fitted, never a training target
  identity: false            # true: A = B (input A is B's own grid) in training and eval
  moment_pairs: 100          # random pairs the A input's (paired-frame) moments are computed over

model:
  dim: 2048
  num_blocks: 9
  num_heads: null            # null: dim / 64
  use_a: true                # false: the B-only control (no A branch, no cross-attention)
  layer_scale_init: 1.0e-4
  checkpoint_activations: true
  z_ref: 1.8                 # token positions: one unit = one patch width at this depth (B's fx; rope-xyz's rope_z_ref)
  slot_scale_px: 7.0         # per-slot relative anchors: one unit = this many pixels at z_ref
  decode_clamp: scale        # gs_diffusion.decode_x0: only the scale channels clamped (one shared range)

loss:
  l1_weight: 1.0             # train_gs's photom weights
  dssim_weight: 0.85
  background: random         # random: a fresh U[0,1]^3 solid colour per rendered view and step, render and GT composited over it

train:
  pairs_per_step: 2          # (A, B) samples per step (one forward each)
  views_per_pair: 4          # training views rendered per sample from its one forward (views 0 .. train_views-1, no repeats)
  lr: 1.0e-4
  weight_decay: 0.01         # AdamW's default
  warmup_steps: 500
  decay_fraction: 0.1        # cosine to min_lr over the last fraction of max_seconds
  min_lr: 1.0e-6
  grad_clip: 1.0
  max_seconds: 9900          # training time (eval / checkpoint time excluded); the run stops there
  max_steps: null
  seed: 0
  log_every: 1               # W&B every step (overfit convention)
  eval_every: 500
  eval_pairs: 30
  eval_seed: 0
  checkpoint_every_seconds: 1800
  bf16: true

direct:                      # mode direct
  pair: null                 # [a, b]; null: the first eval pair
  steps: 3000
  eval_every: 250
  lr:                        # raw-unit learning rates (fit_anchored's per-view fine-tune / combined fit)
    opacity: 0.025
    scale: 0.005
    rotation: 0.001
    sh_dc: 0.0025
    offset: 0.0004

output_dir: /app/bla/reanchor/runs/${now:%Y%m%d_%H%M%S}

wandb:
  project: gsviawt
  mode: offline              # online | offline | disabled
  name: null
  id: null
  tags: [reanchor]

hydra:
  job:
    chdir: false
  run:
    dir: ${output_dir}
