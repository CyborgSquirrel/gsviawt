defaults:
  - view_strategy: turntable-lite
  - mesh_strategy: random
  - _self_

# Whether to capture the RGBA image pass (adds an "images" dataset, N x H x
# W x 4 uint8). Depth peel / pose / intrinsics are captured regardless.
render: true

# Cycles compute device (also used for the depth peel when RGB is EEVEE): "auto" (GPU, fall back to CPU), "gpu", or "cpu".
device: auto

output_path: /app/bla/objaverse_renders.h5
# RGB render resolution. 504 (not Objaverse blender_script's 512) so pixels
# line up 1:1 with r75b's 504x504 output -- wt_infer_layers.py is run
# without --center-crop.
width: 504
height: 504

# Depth-peel resolution. Defaults to the RGB resolution via interpolation;
# override to render the depth maps at a different resolution than the RGB
# pass (e.g. a cheaper low-res peel, or a higher-res one for geometry work).
# The output always has both `depth_intrinsics` (matches `depth_peel`) and
# `image_intrinsics` (matches `images`); they're identical when the two
# resolutions match. Note the compare_wt_depth.py tooling compares WT's
# prediction (at RGB res) against `depth_peel` pixel-for-pixel, so it needs
# these equal unless you resize first.
depth_width: ${width}
depth_height: ${height}

max_peel_layers: 6

# Depth-only re-render: path to an existing render_objaverse h5. When set,
# the view/mesh strategies and scene settings above are ignored -- meshes,
# camera poses, lens, normalize_object, depth_scale and peel layer count all
# come from that file -- and only `depth_peel` (+ `depth_intrinsics`) is
# re-rendered at depth_width x depth_height; every other dataset is copied
# through, row-aligned. Pass both depth_width and depth_height explicitly
# (they otherwise follow ${width}/${height}).
source_path: null
# With source_path: re-render the RGB too (with this run's render_engine /
# eevee_samples, at the source's RGB resolution) instead of copying `images`.
source_rerender_rgb: false
# With source_path: only the first N meshes of the source (quick tests).
# Requires source_rerender_rgb, since copied images can't be subset.
source_max_meshes: null

# Queue mode: instead of rendering every mesh of mesh_strategy, claim meshes (one job = one mesh with
# all its views) from a job_queue.JobQueue sqlite file whose "meshes" meta entry is the full mesh list
# (jobs carry {"mesh_index": i}); the rows keep that global mesh_index. A job is marked done only after
# its rows are committed to output_path. Give every worker process its own output_path.
queue_path: null
queue_worker: null       # this worker's id in the queue (null = the process id)
queue_max_meshes: null   # exit after claiming this many meshes (null = until none is ready)

# --- Objaverse blender_script.py conventions ---
# Recenter the object on the origin and scale so its longest bbox axis == 1
# (Objaverse / Shap-E "unit cube" normalisation). With a fixed
# camera_distance this fully determines framing -- no frame_object_robust.
normalize_object: true
camera_distance: 1.9

# Camera FOV. wt solves ~54deg from its own predicted XYZ regardless of the
# input, matching wt/data.py's FIXED_FX=500 @ 512px (2*atan(256/500) ~=
# 54.25deg) -- so match that, not Objaverse blender_script.py's own 35mm/
# 32mm lens (~49.3deg). lens/sensor chosen so fx == 500*(504/512) at 504px.
# For the literal Objaverse render camera use lens=35, sensor_width=32.
camera_lens: 50.0
camera_sensor_width: 51.2

# Engine for the RGB pass only: CYCLES | BLENDER_EEVEE_NEXT. The depth peel
# always runs on Cycles (it relies on exact per-pixel Z tests through a
# transparent BSDF, which EEVEE's dithered transparency doesn't guarantee), so
# depth_peel is identical whichever engine renders the RGB. EEVEE needs a GPU
# EGL context (see the Dockerfile); on Mesa's software GL it's ~100x slower.
render_engine: CYCLES
cycles_samples: 64
# Verbatim bpy.types.SceneEEVEE properties (nested dicts recurse, e.g.
# ray_tracing_options); no effect with render_engine=CYCLES. The defaults are
# what brought EEVEE closest to Cycles on obj_rand500 (see PR): ray tracing
# gives the indirect bounce light Cycles has (shadowed sides otherwise go
# black). Add more with e.g. `+eevee.use_soft_shadows=false`.
eevee:
  taa_render_samples: 64
  use_raytracing: true
# Verbatim bpy.types.Material properties set on every material loaded from
# the mesh, to make EEVEE match Cycles on imported assets (e.g. EEVEE honours
# use_backface_culling from glTF single-sided materials; Cycles ignores it).
# Applied only for EEVEE; the defaults turn culling off so single-sided glTF
# surfaces render both faces as in Cycles.
eevee_materials:
  use_backface_culling: false
  use_backface_culling_shadow: false
film_transparent: true       # RGBA with a real alpha channel

# "objaverse" = blender_script.py's key/fill/rim/bottom SUN rig on black.
# "env" = white world + a single weak top-down key sun.
lighting: objaverse

# Optional post-hoc rescale of the recorded depth_peel + pose translation
# so mean layer-0 surface depth == this value. null leaves depth in the
# normalised-object frame (~camera_distance) -- which, with the unit-cube
# normalize + fixed camera, is already ~constant across meshes, so this is
# usually unnecessary.
camera_depth_target: null

hydra:
  job:
    chdir: false
  output_subdir: null
  run:
    dir: .
