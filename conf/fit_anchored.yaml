# Config for fit_anchored.py -- anchored layered 3DGS for one mesh of a render_objaverse.py h5 (see anchored_3dgs.py's
# docstring for the pipeline). One run = one mesh (mesh_index), or the meshes of a shard one after another (mesh_indices);
# rerunning the same command resumes (finished stages / views / DONE meshes are skipped).
# Also composed into build_dataset.yaml as its `fit` key (fit_anchored@fit): hence the absolute (/hydra/..., _global_) overrides.
defaults:
  - _self_
  - override /hydra/job_logging@_global_.hydra.job_logging: none      # the script logs through logging.basicConfig
  - override /hydra/hydra_logging@_global_.hydra.hydra_logging: none

hdf5_path: ???          # render_objaverse.py h5 with depth_peel (+ depth_peel_normals for the spacing levels)
mesh_index: null        # one mesh: its rows are the h5 rows with this mesh_index, local view v = its v-th row
mesh_indices: null      # shard mode instead (exactly one of the two): a list of mesh indices, or all (every mesh with rows),
                        # fitted in this process one after another; a fit error stops the run (no mesh is skipped)
packed: null            # shard mode: once every listed mesh is DONE, pack their grids into this file (e.g. <shard>/grids.h5;
                        # grid_io.pack_dir) and delete the per-view grid files + anchors.npz / combined.npz (regression.json,
                        # timing.json, DONE stay); null = keep the per-view files, no packing
output_dir: ???         # <output_dir>/grids_sparse/mesh<M>_view<V>.h5 per training view: finalized sparse grids (grid_io.py),
                        # train with diffusion.grids_dir=<output_dir>/grids_sparse -- no finalize / convert step;
                        # per-mesh state (anchors, combined fit, timings, regression.json, DONE) in <output_dir>/_anchored/mesh<M>/
shared_output_dir: null # also write each training view's subset straight from the combined fit (no fine-tune) here, same
                        # format (<shared_output_dir>/grids_sparse/); null = don't
save_dense: false       # true: ALSO write the old dense grid <root>/mesh<M>_view<V>/gaussians.grid.h5 (~1.6x the bytes; for
                        # finalize_fit_dataset.py -> grids/). false: sparse only, no dense grid file is ever written
# the last round(val_fraction x n) views of the mesh are excluded entirely (not merged, no camera, no grid)
val_fraction: 0.1
seed: 0
device: cuda

merge:
  r: 1.0                # merge radius / RMS-spread limit, x the clusters' mean footprint
  k: 8                  # nearest clusters considered per round
  max_rounds: 200
levels: 3               # density levels (log-scale + opacity sets) per anchor, one octave apart
init_opacity: 0.1

combined:
  steps: 30000
  offset_lr_start: 1.0  # offset lr factor (x lr.offset), exponential start -> end over the run
  offset_lr_end: 0.01
finetune:
  steps: 300
  pos_lr_start: 0.1     # offset lr factor (x lr.offset), exponential start -> end over the fine-tune
  pos_lr_end: 0.01

lr:
  offset: 0.00016       # x scene_extent (fit_3dgs.load_scene_h5's, over the training cameras)
  offset_weight_decay: 0.3   # AdamW decoupled weight decay on the offsets (combined fit and fine-tune): pull toward the anchor.
                             # Held-out PSNR vs median offset from the slot (40 meshes): 0 -> +0.02 dB / 5.1 px, 0.3 -> ref / 4.0 px,
                             # 1 -> -0.08 dB / 2.7 px, 3 -> -0.30 dB / 1.4 px, 10 -> -0.73 dB / 0.7 px
  sh0: 0.0025
  opacities: 0.025
  scales: 0.005
  quats: 0.001

loss:
  lambda_dssim: 0.2
  background: black     # training-loss background: black (render over black vs premultiplied GT) | noise (both composited over
                        # a fresh per-pixel uniform RGB noise image every step, combined fit and fine-tune; seeded from seed)
                        # | color (the same, over one fresh uniform random solid RGB colour per step).
                        # Evaluation (regression mode's held-out PSNR) is always over black

# regression mode: these local views are held out instead of the val_fraction split, and every written view's held-out PSNR
# (mean over these views, full image, like fit_3dgs's val/PSNR) is reported for the shared and the fine-tuned grids
regression:
  held_views: null

log_every: 1000         # console loss line every this many steps (the per-step losses are saved, and go to wandb when on)
wandb:
  project: gsviawt
  mode: disabled        # online | offline | disabled
  tags: [fit-anchored]
  name: null            # null: anchored-mesh<M>

hydra:
  job:
    chdir: false
  output_subdir: null
  run:
    dir: .
