defaults:
  - view_strategy: turntable-lite
  - mesh_strategy: list
  - _self_

# Whether to capture the RGB image pass (adds an "images" dataset). Depth
# peel, camera pose, and intrinsics are captured either way.
render: true

# Cycles compute device: "auto" (try GPU, fall back to CPU), "gpu" (require
# GPU), or "cpu" (force CPU).
device: auto

output_path: /app/bla/renders.h5
width: 504
height: 504
max_peel_layers: 6

# SCENE-RESCALE VARIANT (see wt-depth-normalize for the depth-numbers-only
# version). Imported meshes are always recentered + rescaled to a canonical
# size (reset()'s bake), so depth_peel Z is roughly consistent across
# meshes regardless of a glb's arbitrary absolute scale (was ~2 to ~3000
# raw). If this is also set, each framed scene is additionally rescaled so
# the object center sits exactly this far down the camera axis -- ~1.904
# matches world-tracing r75b's expected mean foreground depth
# (wt.inference.XYZ_MEAN[2]). Both rescales mutate scene geometry (not just
# the recorded numbers): image-preserving for scale-independent materials,
# but objaverse meshes with volume/SSS materials will visibly shift. The
# cumulative per-view factor back to the mesh's original units is saved to
# `depth_scale`.
camera_depth_target: null

hydra:
  job:
    chdir: false
