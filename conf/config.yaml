defaults:
  - view_strategy: turntable-lite
  - mesh_strategy: list
  - _self_

# Whether to capture the RGB image pass (adds an "images" dataset). Depth
# peel, camera pose, and intrinsics are captured either way.
render: true

# Cycles compute device: "auto" (try GPU, fall back to CPU), "gpu" (require
# GPU), or "cpu" (force CPU).
device: auto

output_path: /app/bla/renders.h5
width: 504
height: 504
max_peel_layers: 6

# If set, the recorded depth_peel Z and camera pose are scaled per view so
# the mean layer-0 foreground depth equals this value, making depth
# comparable across meshes whose glb units are arbitrary (raw values range
# ~2 to ~3000). 1.904 matches world-tracing r75b's expected mean foreground
# depth (wt.inference.XYZ_MEAN[2] / DEPTH_MEAN). The RGB render and scene
# geometry are untouched; the per-view factor is saved to `depth_scale`
# (divide by it for raw units). null = record raw glb units.
camera_depth_target: null

hydra:
  job:
    chdir: false
