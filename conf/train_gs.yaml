# Config for train_gs.py -- train a point-cloud-anchored 3D Gaussian
# Splatting prediction model (a per-patch linear head over cached World
# Tracing decoder tokens) on a wt_features.py output h5. See train_gs.py's
# module docstring.

defaults:
  - data/mesh_split: fraction
  - data/view_split: fraction
  # The image encoder in front of the head (data.input=image or features_image), e.g. model/backbone=moge_mix (see
  # conf/model/backbone/*.yaml, instantiated by Hydra); none by default: the head's input is cached features.
  - model/backbone: null
  # LR scheduler: step_cosine (warmup + cosine over total_steps), time_wsd (warmup-stable-decay over
  # max_seconds of training time; also stops the run -- see conf/sched/time_wsd.yaml), or sched=null for none
  - sched: step_cosine
  - _self_

# Stop after this many seconds of TRAINING time (the optimization pass of each batch: forward, backward,
# optimizer step -- not validation, checkpoint saves or any callback; see module.TrainClock). The run
# then validates and writes final.ckpt to the output dir. Also the length of the time_wsd LR schedule
# (sched=time_wsd needs it). null = no time limit. Every wandb row gets train_seconds when it is set.
max_seconds: null

# Directory for everything a single run produces.
output_dirname: 3dgs-model-${now:%Y-%m-%d_%H-%M-%S}
output_dir: outputs/${output_dirname}

seed: 42

torch_detect_anomaly: false

# Path to a Lightning checkpoint (e.g. an earlier run's
# ${output_dir}/last.ckpt or model-{epoch}-{step}.ckpt) to resume from --
# restores model/optimizer/scheduler state and the trainer's epoch/step
# counters, then continues training into a fresh output_dir. null: fresh run.
ckpt_path: null
# With ckpt_path: true -> drop the checkpoint's saved LR-scheduler state and use the scheduler built from this
# config (sched=...), e.g. to extend a time_wsd run or warm up again; the optimizer, model and clock are restored
# as usual. false: the saved state is loaded, and a time_wsd checkpoint with different schedule parameters raises.
reset_scheduler: false

data:
  # The volumes (one per source view; an epoch is one pass over them): EITHER cached features / a listing of
  # source views (features_h5, a wt_features.py output h5; the render h5 it came from is its `source_h5` attr),
  # OR the render shards themselves (render_h5, needs input: image): a path, a list or a glob(s) of
  # render_objaverse.py h5 files, no merging -- every view of every shard is a volume, and its supervision views are
  # the other views of its mesh in its own shard. The mesh/view splits below act on the meshes of all the shards.
  features_h5: null
  render_h5: null
  num_layers: 6             # must match the file(s)' depth_peel layer count
  # Random views of the volume's mesh sampled per access and supervised on
  # ("target" in loss.photom.for), in addition to the volume's own source view.
  num_views: 1
  # Whether the volume's own source view can be one of the sampled views.
  # false: it never is (it's dropped from the draw).
  allow_source_as_target: false
  # Train/val split, in two stages, each a config group picked via the `defaults:` list up top (a one-token
  # CLI override, e.g. data/mesh_split=names data.mesh_split.val_meshes='[a.glb,b.glb]'; the paths are the
  # render h5's `mesh_paths` entries):
  #   1. data/mesh_split: all meshes -> train_meshes + val_meshes
  #   2. data/view_split: the train_meshes' views -> train_views + val_views
  # A feature volume goes where its SOURCE view is; training uses the train views' volumes, and each volume
  # samples its num_views supervision views from the views of its own half. Each non-empty piece is validated
  # separately, logged under its own prefix (see train_gs.GSDataModule):
  #   val_meshes:       volumes of the held-out meshes, every view of theirs eligible as target
  #   val_views_strain: train meshes, sources = train views (as many per mesh as it has val_views), targets = val_views
  #   val_views_sval:   train meshes, sources AND targets = val_views
  # See conf/data/mesh_split/*.yaml and conf/data/view_split/*.yaml. The defaults hold out 10% of the meshes
  # and no views.
  # The sets are always complete; how much of each a validation scores is set per validation (see
  # callbacks.validation_small / validation_big, and trainer.limit_val_batches for Lightning's own).
  # Resample the source view's depth (nearest neighbour) to this square size, for features
  # extracted at the model size from a larger render: 504 for r75b on a 512 render. null = off.
  depth_size: null
  # features: the head's input is read from features_h5. image: items carry the source view's RGB
  # image instead (select a model/backbone); features_h5 then only lists the volumes
  # (view_indices, mesh_index, source_h5) -- its features are not read. features_image: both
  # (model.rgb_patch).
  input: features           # features | image | features_image (both: model.rgb_patch)
  image_size: 504           # side of the image fed to the backbone (input: image), a multiple of 14

model:
  patch_size: 14            # WT's patch size; head output grid = sqrt(P) * patch_size per side
  feature_dim: 1536         # per-token feature channels (WT decoder_embed_dim for r75b; 1024 for MoGe)
  # Append a learnable vector of this many channels, one per Gaussian layer, to every
  # token. Lets the features be a single [1, P, D] map (e.g. extractor=moge), repeated
  # across the data.num_layers Gaussian layers. null = off (features need L == data.num_layers).
  # With transformer.num_blocks > 0, feature_dim + layer_embed_dim must split into
  # num_heads heads whose size is a multiple of 4.
  layer_embed_dim: null
  # Learned Linear(feature_dim -> input_proj_dim) on the features before the layer embedding is
  # appended (WT's own final_project does this to its 4-block encoder concat). Keeps the trunk
  # width at input_proj_dim + layer_embed_dim for a wide feature, e.g. 4096 channels from
  # 4 DINOv2 blocks. null = off.
  input_proj_dim: null
  # With input_proj_dim: start the projection as the identity on the first input_proj_dim input
  # channels (the rest zero), so the model starts out as the one without the extra channels.
  input_proj_identity_init: false
  # Concatenate each patch token's own RGB pixels (3 * patch_size^2 channels, in [-1, 1], from the
  # source image) to its features. Needs data.input=features_image, and feature_dim = the cached
  # feature dim + 588 (patch_size 14).
  rgb_patch: false
  # With rgb_patch: only layer 0 gets the RGB patch; layers 1.. get N(0, 1) noise of the same shape
  # instead, freshly sampled on every forward pass (also at val and in the callbacks).
  rgb_patch_noise: false
  # (An image encoder in front of the head is the model/backbone config group, see the defaults above; it needs
  # data.input=image, feature_dim=1024.)
  # Optional transformer trunk in front of the per-patch linear projection (a
  # small version of World Tracing's head: blocks cycle frame -> ray -> global
  # attention, plus a per-layer FiLM; see gs_decoder.TransformerTrunk).
  transformer:
    num_blocks: 0           # 0 = just the linear projection
    num_heads: 24           # must divide feature_dim into heads whose size is a multiple of 4
    mlp_ratio: 4.0
    layer_scale_init: 1.0e-4  # small -> the trunk starts close to the identity
    checkpoint_activations: false   # recompute the blocks in backward (less memory, same numerics)
  max_sh_degree: 0           # 0 = plain RGB, 1 = DC + 1 SH band (9 extra channels).
                              # Default 0 for now: fit_gsplat.py's ground truth is flat
                              # RGB with no SH>0 at all, so direct_color_weight only ever
                              # supervises sh_dc -- with sh_degree=1, sh_rest gets zero
                              # gradient AND (if color_reg_weight=0, e.g. isolated
                              # direct-color experiments) zero regularization, free to
                              # drift arbitrarily via the shared decoder trunk. Since
                              # it's genuinely view-dependent, that drift shows up as
                              # flickering ("disco ball") on an orbiting camera. Revisit
                              # once there's an actual view-dependent-shading signal to
                              # train sh_rest against.
  # Xavier-uniform init scale/bias per output group. opacity/rotation/sh are
  # Flash3D's own values; scale_bias is NOT (see below); scale_lambda IS
  # (Flash3D's own 0.01) -- damps how far exp(raw) can push the multiplier
  # away from the min_scale_mult floor, an extra safety margin on top of
  # pixel-anchoring against scale blowing up (see min_scale_mult below and
  # GSModel.forward -- an un-anchored, undamped scale sitting near
  # object-size, not pixel-size, was confirmed to blow up gsplat's
  # isect_tiles memory allocation).
  opacity_scale: 1.0e-3
  opacity_bias: 0.0
  scale_scale: 1.0e-1
  # "scale" is a MULTIPLIER on each pixel's own real geometric footprint
  # (depth/fx at that pixel -- see GSModel.forward), not an absolute
  # world-unit value like Flash3D's own scale_bias=0.02 (tuned for their
  # real-world-scale video scenes, meaningless for our unit-cube-normalized
  # objects). bias=log(scale_bias) -> multiplier~1 at init, i.e. "start at
  # one pixel of spacing". Un-anchored absolute scale let the network settle
  # on sub-pixel Gaussians that only looked fine because gsplat's
  # antialiasing eps2d floor (hard-coded ~3px minimum) papered over the gap
  # -- visible the moment a render's true projected size (novel distance,
  # etc.) exceeds that floor. A good INIT value alone isn't enough either:
  # eps2d makes the loss gradient vanish once a Gaussian is already
  # sub-floor, so exp(raw) can (and empirically does, given enough steps)
  # drift back below the floor during training with nothing to stop it.
  # min_scale_mult is a HARD floor added on top of the multiplier (final
  # scale = (min_scale_mult + exp(raw)*scale_lambda) * pixel_scale) --
  # scale can never render below min_scale_mult pixels of spacing,
  # regardless of what raw learns.
  scale_bias: 1.0
  scale_lambda: 0.01
  min_scale_mult: 1.0
  sh_scale: 1.0
  # Zero-init the decoder's final 1x1 conv WEIGHT (bias still gets the
  # per-group values above, e.g. log(scale_bias)) instead of the
  # Xavier-uniform per-group init. At step 0 every pixel/layer then predicts
  # the exact same constant Gaussian (whatever the biases encode), with the
  # encoder features contributing nothing until gradients grow the weight
  # away from zero. false (default): unchanged Xavier-uniform init.
  zero_init_last_conv: false
  # Residual mean prediction: the decoder also emits a per-pixel per-layer
  # camera-space xyz offset (3 extra channels per layer, zero-initialized),
  # and each Gaussian's mean becomes depth-peel position + offset instead of
  # the depth-peel position alone -- see train_gs.flatten_gaussians. Same idea
  # as 3dgs-paper-repro's fit_3dgs.py layered mode (frozen original +
  # optimizable offset), predicted by the network here instead of optimized
  # per-scene. Regularized by loss.mean_offset_reg_weight. false (default):
  # unchanged behavior, and the decoder's output conv keeps its old shape, so
  # existing checkpoints still load.
  predict_mean_offset: false

loss:
  photom:
    for: [target]
    l1_weight: 1.0
    dssim_weight: 0.85

  # Composite both the predicted render AND the ground truth onto a
  # background color before computing the photometric losses above --
  # train stage only (module.GSLightningModule._step), never val, and never
  # visualizations (_preview_entry/panels/orbit videos don't call
  # model_forward at all, so they're unaffected regardless of this flag).
  # white: composite onto solid white. random: a different random color per
  # BATCH ITEM (not per view -- every view of a given item shares one
  # color), uniform in [0,1]^3. null (default): unchanged behavior, whatever
  # background gsplat/render_objaverse.py already use.
  background: null   # white | random | null

  scale_reg_weight: 0.001    # 0 disables; penalizes scale > scale_reg_thresh
  scale_reg_thresh: 0.05     # ~5% of a unit-cube object -- already a big single Gaussian.
                              # (2.0, Flash3D's own value, was 2x the whole object -- inert here.)

  # model.predict_mean_offset only: weight on an L2 penalty on the predicted
  # offset (offset.pow(2).sum(-1), averaged over valid Gaussians) added to
  # the train loss, pulling Gaussians back toward their depth-peel anchor
  # instead of letting the offset drift unconstrained. 0 disables the penalty
  # term (offset still predicted, just unregularized). No effect when
  # predict_mean_offset=false. Same untuned default as 3dgs-paper-repro's
  # conf/fit_3dgs.yaml -- adjust to taste.
  mean_offset_reg_weight: 0.01

# Events (module.Events): named things that happen on a training step, for callbacks to act on. A name is
# fired by a cadence here (exactly one of every_n_steps / every_n_epochs / every_n_seconds -- TRAINING seconds
# on module.TrainClock; every_n_epochs fires on the last batch of an epoch) or by the LR scheduler
# (sched.trough_event), e.g.
#   events: {panel_tick: {every_n_seconds: 600}}
# A callback's trigger_event is either such a name (it acts on the steps where that event fired) or a
# cadence of its own, a mapping with exactly one of the same three keys, for a one-off that needs no name,
# or a list of those (acts when any is due, e.g. [trough, panel_tick]), or null for never. Every event name a
# callback asks for must be fired by an events: entry or a scheduler's
# trough_event (checked when training starts).
events: {}

# orbit / panel / scale_layers / event_checkpoint / validation_small / validation_big each act on their trigger_event, e.g.
# callbacks.orbit.trigger_event={every_n_seconds:1800} or callbacks.orbit.trigger_event=trough. The Lightning
# checkpoint below keeps ModelCheckpoint's own every_n_epochs / train_time_interval.
callbacks:
  # https://pytorch-lightning.readthedocs.io/en/2.6.1/pytorch/api/lightning.pytorch.callbacks.LearningRateMonitor.html
  lr_monitor:
    _target_: lightning.pytorch.callbacks.LearningRateMonitor

  # https://lightning.ai/docs/pytorch/stable/optional-api/api/lightning.pytorch.callbacks.ModelCheckpoint
  checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${output_dir}
    filename: "model-{epoch}-{step}"
    every_n_epochs: ${eval:'${trainer.max_epochs} // 10'}
    save_last: true
    save_on_exception: true
    save_weights_only: false

  # A checkpoint in the output dir whenever trigger_event is due, named by filename ({count}: how many so
  # far, {step}: the completed optimizer steps). null = off. (final.ckpt is written by the TrainClock when
  # max_seconds is spent.) E.g. one every tenth of a max_seconds run:
  # callbacks.event_checkpoint.trigger_event={every_n_seconds:7200}, or at every LR trough: =trough.
  event_checkpoint:
    _target_: module.EventCheckpoint
    trigger_event: null
    filename: "checkpoint-{count}-step{step}.ckpt"

  # Validations run right after the step where their trigger_event is due (Lightning itself only validates on
  # trainer.val_check_interval / check_val_every_n_epoch, or when asked to stop); null = off. A step is
  # never validated twice: these win over Lightning's own check. Each scores `volumes` volumes of EACH
  # validation set (a whole number: that many; a percentage string like "50%": that proportion of the set;
  # null: the whole set; decimals as a count are rejected),
  # taken from the start of the shuffling val dataloaders, so a fresh random sample every time (a set with
  # fewer volumes is scored whole). Metrics are logged as <set>/<name>/<metric>, with <set>/<name>/
  # n_volumes and loss_se (the standard error of the logged mean). A small one often, a big one rarely, e.g.
  #   callbacks.validation_small.trigger_event=periodic  callbacks.validation_big.trigger_event=trough
  # at_end: the validation also runs on the last step of the run (the TrainClock's max_seconds), so the
  # final validation is the big one, with its name and size. (Lightning's own validations, which a run
  # with an at_end validation doesn't have, are sized by trainer.limit_val_batches and logged as
  # <set>/lightning/<metric>.)
  validation_small:
    _target_: module.EventValidation
    name: small
    trigger_event: null
    volumes: 200
    at_end: false
  validation_big:
    _target_: module.EventValidation
    name: big
    trigger_event: null
    volumes: 1500
    at_end: true
  # diffusion mode: the same validations with the EMA weights (diffusion.ema), logged as <set>/small_ema/..., <set>/big_ema/...
  # (give them the same trigger_event as their raw-weights twins; no effect without diffusion.enabled)
  validation_small_ema:
    _target_: module.EventValidation
    name: small_ema
    trigger_event: null
    volumes: 200
    at_end: false
    ema: true
  validation_big_ema:
    _target_: module.EventValidation
    name: big_ema
    trigger_event: null
    volumes: 1500
    at_end: true
    ema: true

  # n_volumes and loss_se of every validation (see module.ValidationStats)
  validation_stats:
    _target_: module.ValidationStats

  orbit:
    _target_: module.OrbitCallback
    trigger_event:
      every_n_epochs: ${eval:'${trainer.max_epochs} // 50'}
    num_frames: 24
    fps: 12
    crf: 28                    # x264 quality (higher = smaller/faster; fine for monitoring)
    elevation_deg: 20.0        # camera distance = the actual source view's own capture distance,
                                # not a re-fit bounding-sphere framing -- see GSLightningModule._preview_entry
    grid: [1, 1]               # [width, height]: objects (different meshes) per video, each orbiting in its own cell; resolution is then the whole video's longer side
    resolution: 1024           # longer side of the turntable frames in px (aspect kept); null -> the preview views' own size
    source_view: true          # each object's source (input) view to the left of its orbit; the video is then twice as wide (resolution sizes the orbit frames, not the pair)
    path_format: ${output_dir}/orbits/{stage}_orbit_{mode}{n:06d}.mp4   # null -> temp dir, deleted at fit end ({mode} is always "step")

  panel:
    _target_: module.PanelCallback
    trigger_event:
      every_n_epochs: ${eval:'${trainer.max_epochs} // 50'}

  scale_layers:
    _target_: module.ScaleLayersCallback
    trigger_event:
      every_n_epochs: ${eval:'${trainer.max_epochs} // 50'}

loader:
  batch_size: 1
  num_workers: 4
  persistent_workers: true

trainer:
  max_epochs: 20000
  accelerator: auto
  devices: 1
  # enable_checkpointing: false
  check_val_every_n_epoch: 1
  log_every_n_steps: 1
  default_root_dir: ${output_dir}
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm

# Diffusion mode: a diffusion model over the fitted layered 3DGS grids (gs_diffusion.py, World Tracing's recipe). Needs
# model/backbone=moge_mix, data.input=image and the finalized grids of fit_3dgs.py (grids_dir/*.h5). The timesteps are
# diffusion_schedule.LayerAwareSchedule's phase 1 (per-layer t; the shared-t mixture phase is off). The paper's optimizer
# (AdamW, weight decay 0.01, gradient clipping 1.0) is `optim` / trainer.gradient_clip_val below; keep the repo's own LR schedule.
diffusion:
  enabled: false
  grids_dir: null              # the finalized grids: <grids_dir>/mesh<M>_view<V>.h5
  source_h5: null              # the render file the grids were fit from; null: the grids' own `source_h5` attribute, which is a path on
                               # the machine that fit them -- set this to run elsewhere
  # also needed: data.input=image, data.depth_size=null (the grids are at the
  # depth peel's own resolution; 504 = the size is fine too), loader.batch_size etc. as usual; the grids' size must equal data.image_size
  dim: null                    # trunk width; null = feature_dim + 14 * patch^2 rounded up to a multiple of 64 (a lossless token)
  num_blocks: 3
  img_token_scale: 0.3         # WT's: the normalized image features are scaled before they are concatenated
  checkpoint_activations: true
  steps: 20                    # Euler steps when sampling
  eval_seed: 0                 # the noise of the samples, and of the validation loss
  schedule:
    standard: {mu: 0.0, sigma: 1.0}                         # layers 1.. (logit-normal)
    plateau: {mu: 0.0, sigma: 1.0, mirror: false}           # layer 0: logit-normal up to its mode t* = 0.5, then flat towards t = 1
  ema:
    decay: 0.9995              # WT's, after a warmup ramp; validations with `ema: true` use these weights
  spike_skip:
    factor: 4.0                # a loss above factor * its running average is skipped, a non-finite one always (null: off)
    decay: 0.99
    warmup_steps: 200          # no spike skipped before this many losses were accepted into the average (checkpointed: a resume keeps counting)

optim:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1e-4
# Optimizer settings that override `optim`'s for the parameters of ONE module of the model (model.<name>), e.g. the
# pretrained backbone's own, lower learning rate. A module the model doesn't have (no backbone) is skipped.
optim_groups:
  backbone:
    lr: 1.0e-5

wandb:
  project: gsviawt
  mode: online                # online | offline | disabled
  tags: []
  name: ${output_dirname}
  # Log into an EXISTING W&B run instead of creating one (e.g. when continuing a finished run from its checkpoint,
  # see ckpt_path): id = that run's id (the last part of its URL), resume = "must" (fail if it doesn't exist),
  # "allow" (resume it if it exists, else create it with this id) or "never". null (both): a new run. The
  # run's config is updated with this run's values, its history is appended to.
  id: null
  resume: null

hydra:
  job:
    chdir: false
  run:
    dir: ${output_dirname}
