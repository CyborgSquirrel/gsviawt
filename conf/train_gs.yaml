# Config for train_gs.py -- train a point-cloud-anchored 3D Gaussian
# Splatting prediction model (Flash3D-style encoder/decoder) on
# render_objaverse.py-schema HDF5 files. See train_gs.py's module docstring.

defaults:
  - data/split_fn: by_mesh
  - _self_

# Directory for everything a single run produces.
output_dirname: 3dgs-model-${now:%Y-%m-%d_%H-%M-%S}
output_dir: outputs/${output_dirname}

seed: 42

torch_detect_anomaly: false

# Path to a Lightning checkpoint (e.g. an earlier run's
# ${output_dir}/last.ckpt or model-{epoch}-{step}.ckpt) to resume from --
# restores model/optimizer/scheduler state and the trainer's epoch/step
# counters, then continues training into a fresh output_dir. null: fresh run.
ckpt_path: null

data:
  photom_h5: /app/bla/lite_blackbg.h5   # str, list, or glob(s) -- render_objaverse.py-schema
  num_layers: 6                         # must match the file(s)' depth_peel layer count
  num_target_views: 3                   # extra supervision views per step, alongside self-render
  # Which catalog rows are eligible to be a SOURCE view for train_ds ONLY
  # (GSPairDataset.source_views; not applied to val_ds -- an empty/small val
  # split has no guarantee of overlapping whatever's restricted here, and
  # val is a separate concern from what the model trains to encode). Row
  # positions (H5Catalog.take()'s index space), not raw view_idx values --
  # they coincide for an unsplit single-file catalog (e.g. omit
  # data/split_fn=by_view, which reorders rows via random_split even at
  # val_fraction=0) but NOT after any split that reorders/subsets rows.
  # Target-view sampling is unaffected, still drawn from every view of the
  # source's mesh. null (default): every view is eligible, unchanged
  # behavior.
  source_views: null

  # Whether a source view is also eligible to land in its own target_views
  # list (GSPairDataset.allow_source_as_target). false (default, unchanged
  # behavior): source_view is always excluded, so every sampled target is a
  # genuinely different view. true: source_view is just another member of
  # the mesh's view pool, same odds as any other view.
  allow_source_as_target: false

  # Held-out TARGET views for validating a single-fixed-source setup
  # (requires data.source_views to have EXACTLY one entry) -- GSFixedSourceDataset,
  # indexed by held-out view instead of by source row, so val_ds isn't
  # collapsed to 0/1 rows the way GSPairDataset's own row-indexed val would
  # be with only one eligible source. Raw view_idx values (GSFixedSourceDataset's
  # own domain, not H5Catalog.take()'s row-position space like source_views
  # above). Bypasses data.split_fn entirely (assumes a single-mesh catalog).
  # train_ds's own target-sampling pool automatically excludes these views
  # (via GSPairDataset.target_views), so train/val targets stay disjoint.
  # null (default): unchanged behavior, no fixed-source validation split.
  val_target_views: null
  # How many of val_target_views one validation row renders/supervises at
  # once, through a single encoder pass on the shared source -- see
  # GSFixedSourceDataset. Only used when val_target_views is set.
  val_targets_per_item: 1

  # Train/val split for ordinary multi-scene training (ignored when
  # fixed_source_view or photom_h5_val is set -- see their own comments
  # below). A config group (conf/data/split_fn/*.yaml, picked via the
  # `defaults:` list up top) rather than inline here, so the strategy is a
  # one-token CLI override instead of rewriting _target_ by hand, e.g.:
  #   data/split_fn=by_view data.split_fn.val_fraction=0.2
  #   data/split_fn=by_indices data.split_fn.train_idx='[0,1,2]' data.split_fn.val_idx='[3,4]'
  # See conf/data/split_fn/*.yaml for what each option takes.

  # Single-batch overfit mode (fit_gsplat.py's primary/secondary terms
  # applied here): if set, train on this EXACT source+target view set every
  # step, no resampling at all (ignores num_target_views/split_fn).
  # fixed_target_views is required when fixed_source_view + photom_h5 are
  # both set (irrelevant/ignored in gauss_h5-only mode -- see gauss_h5 below).
  fixed_source_view: null    # int, e.g. 0
  fixed_target_views: null   # list of ints, e.g. [1, 2, 3]
  # A SEPARATE render_objaverse.py-schema corpus (str/list/glob(s)) used
  # EXCLUSIVELY for validation, decoupled from data.photom_h5 -- for the
  # "train on direct Gaussian-parameter supervision, validate
  # photometrically" mode: pair this with fixed_source_view + gauss_h5 +
  # direct_*_weight training. Every val item's source AND target views are
  # drawn from this corpus itself (a GSPairDataset over its own H5Catalog),
  # independent of whatever view train.fixed_source_view points at --
  # validation genuinely tests the trained network as a normal single-image
  # encoder on a different image, not a held-out subset of the training
  # corpus. Also usable (optionally) with ordinary multi-scene training,
  # replacing the split_fn mesh-holdout split with a wholly
  # separate corpus. null (default): when fixed_source_view + gauss_h5 are
  # set and this is left null, val_ds instead falls back to gauss_h5's OWN
  # embedded secondary views (GaussH5ValDataset, gs_dataset.py) -- the exact
  # views fit_gsplat.py fit its ground truth against, with scale/rotation
  # etc. ground-truth-pinned for whichever fields aren't in
  # model.predict_params. Set this explicitly to validate against a
  # genuinely different corpus/image instead.
  photom_h5_val: null
  # fit_gsplat.py output .h5 (per-pixel ground-truth Gaussian params for ONE
  # view). Only used when set, and only together with fixed_source_view --
  # its config_json "primary" must equal fixed_source_view (checked at
  # startup, see gs_dataset._check_ground_truth_consistency). Enables
  # loss.direct_*_weight below. Mutually exclusive with photom_h5 (for now):
  # a gauss_h5 already embeds everything needed to rebuild its own primary
  # view (image/depth/pose, see gs_dataset._read_primary_from_gauss_h5), so
  # it's a fully self-sufficient training source on its own -- set
  # photom_h5=null when using this. photom_h5_val may still be set alongside
  # it to add photometric validation against a separate corpus.
  gauss_h5: null

model:
  backbone:
    num_layers: 50           # ResNet depth (18 or 50)
    pretrained: true         # ImageNet-pretrained trunk
    bn_order: pre_bn         # pre_bn | monodepth -- see gs_encoder.py
    num_ch_dec: [32, 32, 64, 128, 256]
    upsample_mode: nearest
  max_sh_degree: 0           # 0 = plain RGB, 1 = DC + 1 SH band (9 extra channels).
                              # Default 0 for now: fit_gsplat.py's ground truth is flat
                              # RGB with no SH>0 at all, so direct_color_weight only ever
                              # supervises sh_dc -- with sh_degree=1, sh_rest gets zero
                              # gradient AND (if color_reg_weight=0, e.g. isolated
                              # direct-color experiments) zero regularization, free to
                              # drift arbitrarily via the shared decoder trunk. Since
                              # it's genuinely view-dependent, that drift shows up as
                              # flickering ("disco ball") on an orbiting camera. Revisit
                              # once there's an actual view-dependent-shading signal to
                              # train sh_rest against.
  # Xavier-uniform init scale/bias per output group. opacity/rotation/sh are
  # Flash3D's own values; scale_bias is NOT (see below); scale_lambda IS
  # (Flash3D's own 0.01) -- damps how far exp(raw) can push the multiplier
  # away from the min_scale_mult floor, an extra safety margin on top of
  # pixel-anchoring against scale blowing up (see min_scale_mult below and
  # GSModel.forward -- an un-anchored, undamped scale sitting near
  # object-size, not pixel-size, was confirmed to blow up gsplat's
  # isect_tiles memory allocation).
  opacity_scale: 1.0e-3
  opacity_bias: 0.0
  scale_scale: 1.0e-1
  # "scale" is a MULTIPLIER on each pixel's own real geometric footprint
  # (depth/fx at that pixel -- see GSModel.forward), not an absolute
  # world-unit value like Flash3D's own scale_bias=0.02 (tuned for their
  # real-world-scale video scenes, meaningless for our unit-cube-normalized
  # objects). bias=log(scale_bias) -> multiplier~1 at init, i.e. "start at
  # one pixel of spacing". Un-anchored absolute scale let the network settle
  # on sub-pixel Gaussians that only looked fine because gsplat's
  # antialiasing eps2d floor (hard-coded ~3px minimum) papered over the gap
  # -- visible the moment a render's true projected size (novel distance,
  # etc.) exceeds that floor. A good INIT value alone isn't enough either:
  # eps2d makes the loss gradient vanish once a Gaussian is already
  # sub-floor, so exp(raw) can (and empirically does, given enough steps)
  # drift back below the floor during training with nothing to stop it.
  # min_scale_mult is a HARD floor added on top of the multiplier (final
  # scale = (min_scale_mult + exp(raw)*scale_lambda) * pixel_scale) --
  # scale can never render below min_scale_mult pixels of spacing,
  # regardless of what raw learns.
  scale_bias: 1.0
  scale_lambda: 0.01
  min_scale_mult: 1.0
  sh_scale: 1.0
  # Zero-init the decoder's final 1x1 conv WEIGHT (bias still gets the
  # per-group values above, e.g. log(scale_bias)) instead of the
  # Xavier-uniform per-group init. At step 0 every pixel/layer then predicts
  # the exact same constant Gaussian (whatever the biases encode), with the
  # encoder features contributing nothing until gradients grow the weight
  # away from zero. false (default): unchanged Xavier-uniform init.
  zero_init_last_conv: false
  # Which Gaussian fields the network is trained/trusted to predict; the rest
  # are overwritten with data.gauss_h5 values before
  # flattening/rendering. E.g. [scale] isolates scale's own learning signal
  # and pins everything else to ground truth, so an unsupervised field can't
  # silently drift via the shared decoder trunk.
  predict_params: [opacity, scale, rotation, color]
  # z-score constants for the input point cloud's camera-space xyz channels
  # (WT's own training-distribution stats; derived from render_objaverse.py's
  # convention -- unit-cube-normalized objects, camera_distance~=1.9).
  xyz_mean: [-0.0024, -0.0040, 1.9043]
  xyz_std: [0.281, 0.316, 0.706]

loss:
  photom:
    for: [source, target]
    l1_weight: 1.0
    dssim_weight: 0.85

  # Composite both the predicted render AND the ground truth onto a random
  # background color before computing the photometric losses above --
  # train stage only (module.GSLightningModule._step), never val, and never
  # visualizations (_preview_entry/panels/orbit videos don't call
  # model_forward at all, so they're unaffected regardless of this flag). A
  # different random color per BATCH ITEM (not per view -- every view of a
  # given item shares one color), uniform in [0,1]^3. false (default):
  # unchanged behavior, whatever background gsplat/render_objaverse.py
  # already use.
  random_bg: false

  scale_reg_weight: 0.001    # 0 disables; penalizes scale > scale_reg_thresh
  scale_reg_thresh: 0.05     # ~5% of a unit-cube object -- already a big single Gaussian.
                              # (2.0, Flash3D's own value, was 2x the whole object -- inert here.)

  # Direct per-pixel supervision of the model's own predicted Gaussian
  # params against a fit_gsplat.py ground-truth .h5 (data.gauss_h5),
  # as an alternative/complement to the photometric losses above. All
  # default 0 (opt-in); when ALL of l1_weight/ssim_weight/mask_weight AND
  # these are left at their defaults, behavior is unchanged from today. When
  # all photometric weights are 0 and at least one of these is nonzero, the
  # per-step gsplat rasterization call is skipped entirely (see
  # train_gs.compute_loss); render panels/orbit videos still work regardless
  # (force_render=True at those call sites).
  direct_opacity_weight: 0.0
  direct_scale_weight: 0.0     # compared in log-space (both sides are
                                 # already absolute world-unit sizes)
  direct_rotation_weight: 0.0  # sign-invariant (1 - |dot(q_pred, q_gt)|)
  direct_color_weight: 0.0     # only touches sh_dc's gradient (SH_C0*sh_dc+0.5
                                 # vs. gt's flat RGB) -- sh_rest has no GT signal

callbacks:
  # https://pytorch-lightning.readthedocs.io/en/2.6.1/pytorch/api/lightning.pytorch.callbacks.LearningRateMonitor.html
  lr_monitor:
    _target_: lightning.pytorch.callbacks.LearningRateMonitor

  # https://lightning.ai/docs/pytorch/stable/optional-api/api/lightning.pytorch.callbacks.ModelCheckpoint
  checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    dirpath: ${output_dir}
    filename: "model-{epoch}-{step}"
    every_n_epochs: ${eval:'${trainer.max_epochs} // 10'}
    save_last: true
    save_on_exception: true
    save_weights_only: false

  orbit:
    _target_: module.OrbitCallback
    every_n_epochs: ${eval:'${trainer.max_epochs} // 50'}
    num_frames: 24
    fps: 12
    crf: 28                    # x264 quality (higher = smaller/faster; fine for monitoring)
    elevation_deg: 20.0        # camera distance = the actual source view's own capture distance,
                                # not a re-fit bounding-sphere framing -- see GSLightningModule.get_preview_source

  panel:
    _target_: module.PanelCallback
    every_n_epochs: ${eval:'${trainer.max_epochs} // 50'}

  scale_layers:
    _target_: module.ScaleLayersCallback
    every_n_epochs: ${eval:'${trainer.max_epochs} // 50'}

loader:
  batch_size: 1
  num_workers: 4
  persistent_workers: true

trainer:
  max_epochs: 20000
  accelerator: auto
  devices: 1
  # enable_checkpointing: false
  check_val_every_n_epoch: 1
  log_every_n_steps: 50
  default_root_dir: ${output_dir}
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm

optim:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 1e-4

sched:
  _target_: module.WarmupCosineAnnealingLR
  _partial_: true
  total_steps: ${total_steps}
  warmup_steps: ${eval:'int(${total_steps} * 0.05)'}
  min_lr: 1.0e-6

wandb:
  project: gsviawt
  mode: online                # online | offline | disabled
  tags: []
  name: ${output_dirname}

hydra:
  job:
    chdir: false
  run:
    dir: ${output_dirname}
