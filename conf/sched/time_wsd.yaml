# Time-driven warmup-stable-decay (module.TimeWSD). The LR follows the schedule over the top-level
# max_seconds of TRAINING time (the optimization pass of each batch -- not validation, checkpoint saves or
# any callback, see module.TrainClock); max_seconds also stops the run, which then validates and writes
# final.ckpt to the output dir. Needs max_seconds to be set, e.g. sched=time_wsd max_seconds=3600.
_target_: module.TimeWSD
_partial_: true
max_seconds: ${max_seconds}
start_seconds: 0.0        # clock time the schedule starts at (warmup -> plateau -> decay span [start_seconds, max_seconds]);
                          # for a run resumed from a decayed checkpoint, the clock's value there warms up again
cycle_seconds: null       # repeat the warmup -> plateau -> decay every cycle_seconds (must divide max_seconds - start_seconds); null = one cycle
warmup_fraction: 0.05     # linear warmup over this fraction of the span (of a cycle, with cycle_seconds)
decay_fraction: 0.1       # cosine decay over the last fraction of the span (of a cycle, with cycle_seconds)
min_lr: 1.0e-6
