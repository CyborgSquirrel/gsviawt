# wandb_workspace_reanchor.py: a saved W&B view (workspace) for the re-anchoring runs (train_reanchor.py), built from code.
entity: null                 # null: the API key's default entity
project: gsviawt
name: re-anchoring           # the view's name (a NEW view is created every time it is saved)
query: "^reanchor"           # runs shown: a regex on the run name (new runs appear without re-saving)
x_axis: _step                # train_reanchor.py logs eval and train rows with step=<optimizer step>
max_runs: 20
train_smoothing: 0.95        # exponential smoothing of the per-step train panels (0: off); eval panels are never smoothed
save: false                  # false: print the layout only; true: save the view to W&B (writes to the project)
url: null                    # with save=true: an existing view's URL to update in place (its runset kept); null: create a new view
hydra:
  output_subdir: null
  run:
    dir: .
