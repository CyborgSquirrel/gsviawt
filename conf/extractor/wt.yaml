# World Tracing decoder tokens (extractors.WTExtractor): one forward pass per
# (view, seed, noise level) on a *noised* GT layered point cloud, saving the
# decoder token volume that feeds the prediction head.
_target_: extractors.WTExtractor

# --- model ---
config: r75b              # wt.checkpoint.CONFIGS key (r75b / r69e / r76 ...)
ckpt: r75b                # config name | hf://repo[/file.pt] | local .pt path
# Cast the stored weights to bf16 after loading (autocast is bf16 regardless).
# Needed for r75b on the 10GB RTX 3080, else OOM -- see wt_infer_layers.py.
bf16_weights_hack: true

# --- noising ---
# Flow-matching time t in [0, 1]: x_t = (1 - t) * x0 + t * eps. 0 = clean GT
# point cloud, 1 = pure noise. Also the timestep the model is called with.
# A list (e.g. [0.25,0.5,0.75]) runs every level for each seed: rows go view,
# then seed, then noise level, and all levels of a (view, seed) share the same
# sub-seed, i.e. the same eps.
noise_level: 0.5
# Independent noise draws per view. The output has one row per (view, draw,
# noise level), view-major.
seeds_per_view: 1
# Main seed. One SeedSequence(seed); each (view, draw) pair spawns the next child as its
# sub-seed, which seeds torch's global RNG right before every noise level of that pair --
# so eps and the model's own internal randn (invalid-pixel fill) are reproducible and
# differ across views and draws. Note a sub-seed depends on the pair's position in `views`
# and on seeds_per_view. Sub-seeds are saved in the output's `seed` dataset; the main seed
# in the `main_seed` attr.
seed: 42

# --- where in the 42-block decoder chain to take the tokens ---
# null: the output of the last block (what feeds the head). An int i in [0, 41], or a list of
# them: the output of decoder block i (counted from 0), all from ONE forward pass (the blocks
# after the largest are not run). A list gives one row per block (a `block` column), after the
# seed and noise level in the row order.
block: null
# Use the same sub-seed (the first child of `seed`) for every (view, draw), so all volumes
# share one noise realization. Needs seeds_per_view = 1.
shared_seed: false

# --- conditioning image (same knobs as wt_infer_layers.py) ---
bg_color: [0, 0, 0]       # RGB the masked-out region is composited to
hard_alpha: false         # ignore a stored soft alpha; use the layer-0 depth hit
